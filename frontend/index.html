<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Night Desk</title>
  <link rel="stylesheet" href="night-desk-tokens.css">
  <link rel="stylesheet" href="styles.css?v=5">
  <link rel="icon" href="night-desk-logo.svg">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img class="logo" src="night-desk-logo.svg" width="40" height="40" alt="Night Desk">
      <div>
        <h1>Night Desk</h1>
        <p class="sub">Laurel Hill · <span id="screenLabel">Desk</span> · as of <span id="asOf"></span></p>
      </div>
    </div>
    <div class="switch">
      <button type="button" id="showResident">Resident</button>
      <button type="button" id="showDesk">Desk</button>
    </div>
  </header>

  <section id="residentScreen" class="resident" hidden>
    <div class="chat">
      <ol id="chatLog" class="chat-log" aria-live="polite"></ol>
      <form id="requestForm" class="composer">
        <p id="emergencyNote" class="warn" hidden></p>
        <div id="choices" class="choices"></div>
        <div class="composer-row" id="composerRow">
          <textarea id="chatInput" rows="1" placeholder="Type a reply" aria-label="Your reply"></textarea>
          <button type="submit" class="primary" id="chatSend">Send</button>
        </div>
        <div id="chatDone" class="actions" hidden>
          <button type="button" id="sendAnother">Send another</button>
          <button type="button" id="toDesk" class="primary">Open the desk</button>
        </div>
      </form>
    </div>
  </section>

  <main id="deskScreen" class="layout">
    <aside class="filters">
      <input id="search" type="search" placeholder="Search requests…" aria-label="Search requests">
      <h2>Problem</h2>
      <ul id="categoryList" class="chips"></ul>
      <h2>Property</h2>
      <select id="propertyFilter" aria-label="Filter by property"><option value="">All properties</option></select>
      <label class="check"><input type="checkbox" id="overdueOnly"> Overdue only</label>
    </aside>

    <section>
      <div class="listhead">
        <span id="count"></span>
        <select id="sort" aria-label="Sort">
          <option value="priority">Sort: priority</option>
          <option value="newest">Sort: newest</option>
          <option value="oldest">Sort: oldest</option>
        </select>
      </div>
      <ul id="requests" class="requests"></ul>
    </section>
  </main>

  <script src="app.js?v=5"></script>
</body>
</html>
