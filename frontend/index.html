<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Laurel Hill Requests</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%223%22 fill=%22%232f5d8a%22/%3E%3Cpath d=%22M4 12V6l4-3 4 3v6z%22 fill=%22white%22/%3E%3C/svg%3E">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>Laurel Hill Residential</h1>
      <p class="sub">Shared inbox · as of <span id="asOf"></span></p>
    </div>
    <button id="newBtn" class="primary">+ New request</button>
  </header>

  <main class="layout">
    <aside class="filters">
      <input id="search" type="search" placeholder="Search requests…" aria-label="Search requests">
      <h2>Problem</h2>
      <ul id="categoryList" class="chips"></ul>
      <h2>Property</h2>
      <select id="propertyFilter" aria-label="Filter by property"><option value="">All properties</option></select>
      <label class="check"><input type="checkbox" id="overdueOnly"> Overdue only</label>
    </aside>

    <section>
      <div class="listhead">
        <span id="count"></span>
        <select id="sort" aria-label="Sort">
          <option value="priority">Sort: priority</option>
          <option value="newest">Sort: newest</option>
          <option value="oldest">Sort: oldest</option>
        </select>
      </div>
      <ul id="requests" class="requests"></ul>
    </section>
  </main>

  <dialog id="formDialog">
    <form id="requestForm" method="dialog">
      <h2>Send a request</h2>
      <div class="row">
        <label>Name<input name="sender" required></label>
        <label>Phone or email<input name="contact" required></label>
      </div>
      <div class="row">
        <label>Property<select name="property" id="formProperty"><option value="">Not a tenant / not sure</option></select></label>
        <label>Unit<input name="unit" placeholder="e.g. 2B"></label>
      </div>
      <label>Problem type
        <select name="category" id="formCategory"><option value="">Detect automatically</option></select>
      </label>
      <label>Message<textarea name="body" rows="5" required placeholder="Describe what's going on"></textarea></label>
      <p id="emergencyNote" class="warn" hidden></p>
      <div class="actions">
        <button type="button" id="cancelBtn">Cancel</button>
        <button type="submit" class="primary">Send request</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
