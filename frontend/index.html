<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Laurel Hill Requests</title>
  <link rel="stylesheet" href="styles.css?v=2">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%223%22 fill=%22%232f5d8a%22/%3E%3Cpath d=%22M4 12V6l4-3 4 3v6z%22 fill=%22white%22/%3E%3C/svg%3E">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>Laurel Hill Residential</h1>
      <p class="sub"><span id="screenLabel">Desk</span> · as of <span id="asOf"></span></p>
    </div>
    <div class="switch">
      <button type="button" id="showResident">Resident</button>
      <button type="button" id="showDesk">Desk</button>
    </div>
  </header>

  <section id="residentScreen" class="resident" hidden>
    <form id="requestForm">
      <h2>Message Laurel Hill</h2>
      <p class="sub">Nights and weekends. Tell us what’s going on and we’ll take it from here.</p>
      <div class="row">
        <label>Name<input name="sender" required></label>
        <label>Phone or email<input name="contact" required></label>
      </div>
      <div class="row">
        <label>Property<select name="property" id="formProperty"><option value="">Not sure</option></select></label>
        <label>Unit<input name="unit" placeholder="e.g. W-104"></label>
      </div>
      <label>Message<textarea name="body" rows="5" required placeholder="Describe what's going on"></textarea></label>
      <p id="emergencyNote" class="warn" hidden></p>
      <div class="actions">
        <button type="submit" class="primary">Send</button>
      </div>
    </form>
    <div id="receipt" class="card" hidden>
      <h2>We got your message</h2>
      <p id="receiptReply"></p>
      <div class="actions">
        <button type="button" id="sendAnother">Send another</button>
        <button type="button" id="toDesk" class="primary">Open the desk</button>
      </div>
    </div>
  </section>

  <main id="deskScreen" class="layout">
    <aside class="filters">
      <input id="search" type="search" placeholder="Search requests…" aria-label="Search requests">
      <h2>Problem</h2>
      <ul id="categoryList" class="chips"></ul>
      <h2>Property</h2>
      <select id="propertyFilter" aria-label="Filter by property"><option value="">All properties</option></select>
      <label class="check"><input type="checkbox" id="overdueOnly"> Overdue only</label>
    </aside>

    <section>
      <div class="listhead">
        <span id="count"></span>
        <select id="sort" aria-label="Sort">
          <option value="priority">Sort: priority</option>
          <option value="newest">Sort: newest</option>
          <option value="oldest">Sort: oldest</option>
        </select>
      </div>
      <ul id="requests" class="requests"></ul>
    </section>
  </main>

  <script src="app.js?v=2"></script>
</body>
</html>
